<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b6ea8">
<title>Baptize 2027</title>
<style>
/* One small file, no fonts or images: it has to load on a weak phone signal. */
:root{--brand:#0b6ea8;--ink:#13212d;--muted:#5b6977;--line:#cfd8e1;--bg:#f3f6f9;--card:#fff;--bad:#b3261e;--ok:#1c7a45}
@media (prefers-color-scheme:dark){:root{--brand:#3fa6dd;--ink:#e5ecf2;--muted:#94a3b0;--line:#2a3846;--bg:#0b1117;--card:#141d26;--bad:#f08a80;--ok:#5ccc8f}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:96px}
header{background:var(--brand);color:#fff;padding:14px 16px}
header h1{margin:0;font-size:19px}
header p{margin:4px 0 0;font-size:15px;opacity:.9}
main{max-width:560px;margin:0 auto;padding:12px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:2px 14px 14px;margin:12px 0}
.card h2{font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:12px 0 0}
label{display:block;margin-top:12px;font-weight:600;font-size:15px}
input{display:block;width:100%;margin-top:5px;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:11px 12px;min-height:46px}
input:focus{outline:2px solid var(--brand);outline-offset:1px}
.hint{display:block;font-weight:400;color:var(--muted);font-size:14px;margin-top:3px}
.err{display:block;color:var(--bad);font-weight:400;font-size:14px;margin-top:4px}
.bad input{border-color:var(--bad)}
.yn{display:flex;gap:8px;margin-top:6px}
.yn label{flex:1;margin:0;border:1px solid var(--line);border-radius:9px;text-align:center;padding:11px 6px;font-weight:600;cursor:pointer;background:var(--bg)}
.yn input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.yn input:checked+span{color:var(--brand)}
.yn label:has(input:checked){border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}.row .s{flex:0 0 6.5em}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar div{max-width:560px;margin:0 auto;display:flex;gap:12px;align-items:center}
button{font:inherit;font-weight:700;border:0;border-radius:10px;background:var(--brand);color:#fff;padding:12px 22px;min-height:48px;cursor:pointer}
button:disabled{opacity:.5}
#status{flex:1;font-size:15px}
#status.ok{color:var(--ok)}#status.bad{color:var(--bad)}
.msg{text-align:center;color:var(--muted);padding:40px 8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><h1 id="title">Baptize 2027</h1><p id="intro"></p></header>
<main><p class="msg" id="msg">…</p><form id="form" hidden novalidate></form></main>
<div class="bar" id="bar" hidden><div><span id="status" role="status"></span><button id="save" form="form" type="submit">Save</button></div></div>
<script>
(function () {
  var key = (location.pathname.match(/\/p\/([A-Za-z0-9_-]+)/) || [])[1] || new URLSearchParams(location.search).get("key") || "";
  var api = "/api/profile?key=" + encodeURIComponent(key);
  var $ = function (id) { return document.getElementById(id); };
  var T = {};
  // [field, label key, input type, inputmode, hint key, short]
  var GROUPS = [
    [null, [["church_name", "sum_church"], ["street", "sum_street"], ["city", "sum_city"],
      ["state", "sum_state", "text", "", "", 1], ["zip", "sum_zip", "text", "numeric", "", 1],
      ["denomination", "sum_denom"], ["website", "sum_website", "url", "url"]]],
    [null, [["name", "sum_name"], ["email", "sum_email", "email", "email"]]],
    [null, [["contact_name", "sum_contact", "text", "", "web_contact_hint"], ["contact_phone", "web_contact_phone", "tel", "tel"]]],
    ["sum_baptism", [["baptism_same", "web_baptism_same", "yn"], ["baptism_street", "sum_street"], ["baptism_city", "sum_city"],
      ["baptism_state", "sum_state", "text", "", "", 1], ["baptism_zip", "sum_zip", "text", "numeric", "", 1]]],
    [null, [["public_map", "sum_map", "yn"]]]
  ];

  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    for (var k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
    (kids || []).forEach(function (c) { if (c != null) e.append(c); });
    return e;
  }
  function field(f, data) {
    var name = f[0], label = T[f[1]] || name, type = f[2] || "text";
    if (type === "yn") {
      var opt = function (v, word) {
        var i = el("input", { type: "radio", name: name, value: v });
        if (String(data[name]) === v) i.checked = true;
        return el("label", {}, [i, el("span", {}, [word])]);
      };
      return el("div", { id: "f-" + name }, [el("label", {}, [label]), el("div", { class: "yn" }, [opt("true", T.val_yes || "Yes"), opt("false", T.val_no || "No")])]);
    }
    var input = el("input", { name: name, type: type, inputmode: f[3] || null, autocomplete: "off", maxlength: "200" });
    input.value = data[name] == null ? "" : data[name];
    return el("label", { id: "f-" + name, class: f[5] ? "s" : null }, [label, f[4] && T[f[4]] ? el("span", { class: "hint" }, [T[f[4]]]) : null, input]);
  }
  function render(data) {
    var form = $("form");
    GROUPS.forEach(function (g) {
      var card = el("div", { class: "card" }, [g[0] ? el("h2", {}, [T[g[0]] || ""]) : null]);
      var short = [];
      g[1].forEach(function (f) {
        var node = field(f, data);
        if (f[5]) { short.push(node); if (short.length === 2) { card.append(el("div", { class: "row" }, short)); short = []; } }
        else card.append(node);
      });
      form.append(card);
    });
    form.addEventListener("input", sync);
    form.addEventListener("change", sync);
    sync();
  }
  // Show the contact's phone only with a contact name, and the baptism
  // address only when it isn't the church's.
  function sync() {
    var f = $("form");
    $("f-contact_phone").hidden = !f.contact_name.value.trim();
    var away = (f.querySelector("[name=baptism_same]:checked") || {}).value === "false";
    ["baptism_street", "baptism_city", "baptism_state", "baptism_zip"].forEach(function (n) { $("f-" + n).hidden = !away; });
  }
  // Shows the answers as saved (e.g. "Texas" comes back as TX).
  function fill(data) {
    var f = $("form");
    Object.keys(data).forEach(function (k) {
      var i = f.elements[k];
      if (!i) return;
      if (i.length && i[0] && i[0].type === "radio") Array.prototype.forEach.call(i, function (r) { r.checked = String(data[k]) === r.value; });
      else i.value = data[k] == null ? "" : data[k];
    });
    sync();
  }
  function status(text, kind) { var s = $("status"); s.textContent = text; s.className = kind || ""; }
  function fail(text) { $("form").hidden = true; $("bar").hidden = true; $("msg").hidden = false; $("msg").textContent = text; }

  fetch(api).then(function (r) { return r.json().then(function (d) { return [r.status, d]; }); }).then(function (x) {
    T = x[1].text || {};
    if (x[0] !== 200) return fail(T.web_bad_link || "This link doesn't work anymore.");
    document.documentElement.lang = x[1].lang;
    document.documentElement.dir = x[1].dir;
    document.title = $("title").textContent = T.web_title || "Baptize 2027";
    $("intro").textContent = T.web_intro || "";
    $("save").textContent = T.web_save || "Save";
    render(x[1].church);
    $("msg").hidden = true; $("form").hidden = false; $("bar").hidden = false;
  }).catch(function () { fail("Couldn't connect. Check your signal and reload."); });

  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var f = e.currentTarget, body = {};
    Array.prototype.forEach.call(f.elements, function (i) {
      if (!i.name || (i.type === "radio" && !i.checked)) return;
      body[i.name] = i.type === "radio" ? i.value === "true" : i.value;
    });
    f.querySelectorAll(".err").forEach(function (n) { n.remove(); });
    f.querySelectorAll(".bad").forEach(function (n) { n.classList.remove("bad"); });
    $("save").disabled = true; status("…");
    fetch(api, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (d) { return [r.status, d]; }); })
      .then(function (x) {
        if (x[0] === 200) { fill(x[1].church); return status(T.web_saved || "Saved.", "ok"); }
        if (x[0] === 404) return fail(T.web_bad_link || "This link doesn't work anymore.");
        var box = x[1].field && $("f-" + x[1].field);
        status("", "");
        if (box) {
          box.classList.add("bad");
          box.append(el("span", { class: "err" }, [x[1].message || x[1].error]));
          box.scrollIntoView({ block: "center" });
          var i = box.querySelector("input"); if (i) i.focus();
        } else status(x[1].message || x[1].error || "!", "bad");
      })
      .catch(function () { status("Couldn't connect. Try again.", "bad"); })
      .then(function () { $("save").disabled = false; });
  });
})();
</script>
</body>
</html>
