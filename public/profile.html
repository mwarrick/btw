<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b6ea8">
<title>Baptize 2027</title>
<style>
/* One small file, no fonts or images: it has to load on a weak phone signal. */
:root{--brand:#0b6ea8;--ink:#13212d;--muted:#5b6977;--line:#cfd8e1;--bg:#f3f6f9;--card:#fff;--bad:#b3261e;--ok:#1c7a45}
@media (prefers-color-scheme:dark){:root{--brand:#3fa6dd;--ink:#e5ecf2;--muted:#94a3b0;--line:#2a3846;--bg:#0b1117;--card:#141d26;--bad:#f08a80;--ok:#5ccc8f}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:96px}
header{background:var(--brand);color:#fff;padding:14px 16px}
header{display:flex;gap:12px;align-items:center}
header .logo{display:block;flex:0 0 auto;border-radius:8px}
header p{margin:0;font-size:15px;opacity:.9}
main{max-width:560px;margin:0 auto;padding:12px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:2px 14px 14px;margin:12px 0}
.card h2{font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:12px 0 0}
label{display:block;margin-top:12px;font-weight:600;font-size:15px}
input{display:block;width:100%;margin-top:5px;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:11px 12px;min-height:46px}
input:focus{outline:2px solid var(--brand);outline-offset:1px}
.hint{display:block;font-weight:400;color:var(--muted);font-size:14px;margin-top:3px}
.err{display:block;color:var(--bad);font-weight:400;font-size:14px;margin-top:4px}
.bad input{border-color:var(--bad)}
.yn{display:flex;gap:8px;margin-top:6px}
.yn label{flex:1;margin:0;border:1px solid var(--line);border-radius:9px;text-align:center;padding:11px 6px;font-weight:600;cursor:pointer;background:var(--bg)}
.yn input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.yn input:checked+span{color:var(--brand)}
.yn label:has(input:checked){border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.fixed{margin-top:5px;padding:11px 0;font-weight:600}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}.row .s{flex:0 0 6.5em}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar div{max-width:560px;margin:0 auto;display:flex;gap:12px;align-items:center}
button{font:inherit;font-weight:700;border:0;border-radius:10px;background:var(--brand);color:#fff;padding:12px 22px;min-height:48px;cursor:pointer}
button:disabled{opacity:.5}
#status{flex:1;font-size:15px}
#status.ok{color:var(--ok)}#status.bad{color:var(--bad)}
.msg{text-align:center;color:var(--muted);padding:40px 8px}
#history h2{font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:12px 0 10px}
.thread{display:flex;flex-direction:column;gap:4px}
.bub{max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere;padding:8px 12px;border-radius:14px;font-size:15px;align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
.bub.mine{align-self:flex-end;background:var(--brand);color:#fff;border-color:var(--brand)}
.bub a{color:inherit;font-weight:700;margin-inline-end:10px}
.meta{font-size:12px;color:var(--muted);align-self:flex-start;margin-bottom:6px}
.meta.mine{align-self:flex-end}
/* Two columns on a phone, all four side by side when there's room. */
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;max-width:560px;margin:0 auto;padding:12px 16px 0}
.tabs button[hidden]{display:none}
.tabs button{background:var(--card);color:var(--ink);border:1px solid var(--line);min-height:44px;padding:8px}
.tabs button[aria-pressed=true]{background:var(--brand);color:#fff;border-color:var(--brand)}
.choice{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px;font-size:15px}
.choice p{margin:0 0 10px}
.choice button{width:100%}
.choice button.out{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.add{display:block;text-align:center;background:var(--brand);color:#fff;border-radius:10px;padding:13px;margin-top:14px;font-weight:700;cursor:pointer}
a.add{text-decoration:none}
.add input{position:absolute;opacity:0;width:1px;height:1px}
#pstatus{min-height:1.4em;font-size:15px;margin:10px 0 0}
#pstatus.ok,#bstatus.ok{color:var(--ok)}#pstatus.bad,#bstatus.bad{color:var(--bad)}
#bstatus{min-height:1.4em;font-size:15px;margin:10px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:6px}
.grid figure{margin:0;position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.grid img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.viewer img{display:block;width:100%;border-radius:8px;margin-top:12px}
.note{color:var(--muted);font-size:14px;margin:8px 0 0}
.grid .wait{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;font-weight:700;border-radius:6px;padding:3px 7px}
#waiting button{width:100%;margin-top:10px}
.grid .del{position:absolute;right:6px;bottom:6px;min-height:34px;padding:6px 10px;font-size:13px;background:rgba(0,0,0,.65)}
select{display:block;width:100%;margin-top:5px;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:11px 12px;min-height:46px}
.agree{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:15px;margin-top:12px}
.agree input{width:22px;height:22px;min-height:0;margin:1px 0 0;padding:0;flex:0 0 auto}
.welcome{color:var(--ok);font-weight:600;padding:12px 14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><picture><source srcset="/img/b-mark.avif" type="image/avif"><img class="logo" src="/img/b-mark.png" width="48" height="48" alt="Baptize 2027"></picture><p id="intro"></p></header>
<nav class="tabs" id="tabs" hidden><button type="button" id="tab-signup"></button><button type="button" id="tab-photos"></button><button type="button" id="tab-baptisms"></button><button type="button" id="tab-resources" hidden></button></nav>
<main><p class="msg" id="msg">…</p>
<p class="card welcome" id="welcome" hidden></p>
<div class="card" id="langcard" hidden><label for="lang" id="langlabel"></label><select id="lang"></select></div>
<form id="form" hidden novalidate></form>
<section class="card" id="history" hidden><h2 id="htitle"></h2><div class="thread" id="thread"></div></section>
<section id="photos" hidden>
<div class="card viewer" id="viewer" hidden></div>
<div class="card"><p id="pintro"></p><p class="note" id="ptemp"></p>
<div class="choice" id="choice" hidden><p id="choice-text"></p><button type="button" id="choice-btn"></button></div>
<label class="add"><input type="file" id="file" accept="image/*" multiple><span id="add-text"></span></label>
<p id="pstatus" role="status"></p></div>
<div class="grid" id="grid"></div>
</section>
<section id="baptisms" hidden><form class="card" id="bform" novalidate><label for="bcount" id="bquestion"></label>
<input id="bcount" type="number" inputmode="numeric" min="0" max="100000" step="1" autocomplete="off">
<span class="hint" id="bhint"></span><p class="note" id="bupdated"></p>
<button type="submit" id="bsave" style="width:100%;margin-top:12px"></button><p id="bstatus" role="status"></p></form></section>
<section id="resources" hidden><div class="card"><p id="rintro"></p><a class="add" id="ropen" target="_blank" rel="noopener"></a></div></section></main>
<div class="bar" id="bar" hidden><div><span id="status" role="status"></span><button id="save" form="form" type="submit">Save</button></div></div>
<script>
(function () {
  var key = (location.pathname.match(/\/p\/([A-Za-z0-9_-]+)/) || [])[1] || new URLSearchParams(location.search).get("key") || "";
  // Without a key (the site's front page) this is the signup form: the same
  // form, with the phone editable and a language picker, that creates the
  // church and opens its own page.
  var signingUp = !key;
  var api = "/api/profile?key=" + encodeURIComponent(key);
  var photosApi = "/api/profile-photos?key=" + encodeURIComponent(key);
  var $ = function (id) { return document.getElementById(id); };
  var T = {};
  // [field, label key, input type, inputmode, hint key, short]
  var GROUPS = [
    [null, [["church_name", "sum_church"], ["street", "sum_street"], ["city", "sum_city"],
      ["state", "sum_state", "text", "", "", 1], ["zip", "sum_zip", "text", "numeric", "", 1],
      ["country", "sum_country"], ["denomination", "sum_denom"], ["website", "sum_website", "url", "url"]]],
    [null, [["name", "sum_name"], ["email", "sum_email", "email", "email"], ["phone", "web_phone", "fixed", "", "web_phone_hint"]]],
    [null, [["contact_name", "sum_contact", "text", "", "web_contact_hint"], ["contact_phone", "web_contact_phone", "tel", "tel"]]],
    ["sum_baptism", [["baptism_same", "web_baptism_same", "yn"], ["baptism_street", "sum_street"], ["baptism_city", "sum_city"],
      ["baptism_state", "sum_state", "text", "", "", 1], ["baptism_zip", "sum_zip", "text", "numeric", "", 1]]],
    [null, [["public_map", "sum_map", "yn"]]]
  ];

  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    for (var k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
    (kids || []).forEach(function (c) { if (c != null) e.append(c); });
    return e;
  }
  function field(f, data) {
    var name = f[0], label = T[f[1]] || name, type = f[2] || "text";
    // Shown, not a form field: it isn't sent or saved.
    if (type === "fixed") {
      return el("div", { id: "f-" + name }, [el("label", {}, [label]), f[4] && T[f[4]] ? el("span", { class: "hint" }, [T[f[4]]]) : null,
        el("div", { class: "fixed" }, [el("bdi", { dir: "ltr" }, [data[name] || ""])])]);
    }
    if (type === "yn") {
      var opt = function (v, word) {
        var i = el("input", { type: "radio", name: name, value: v });
        if (String(data[name]) === v) i.checked = true;
        return el("label", {}, [i, el("span", {}, [word])]);
      };
      return el("div", { id: "f-" + name }, [el("label", {}, [label]), el("div", { class: "yn" }, [opt("true", T.val_yes || "Yes"), opt("false", T.val_no || "No")])]);
    }
    var input = el("input", { name: name, type: type, inputmode: f[3] || null, autocomplete: "off", maxlength: f[3] === "numeric" ? "10" : "200" });
    input.value = data[name] == null ? "" : data[name];
    return el("label", { id: "f-" + name, class: f[5] ? "s" : null }, [label, f[4] && T[f[4]] ? el("span", { class: "hint" }, [T[f[4]]]) : null, input]);
  }
  function render(data) {
    var form = $("form");
    form.replaceChildren();
    GROUPS.forEach(function (g) {
      var card = el("div", { class: "card" }, [g[0] ? el("h2", {}, [T[g[0]] || ""]) : null]);
      var short = [];
      g[1].forEach(function (f) {
        var node = field(f, data);
        if (f[5]) { short.push(node); if (short.length === 2) { card.append(el("div", { class: "row" }, short)); short = []; } }
        else card.append(node);
      });
      form.append(card);
    });
    if (signingUp) {
      var agree = el("input", { type: "checkbox", name: "consent" });
      agree.checked = !!data.consent;
      form.append(el("div", { class: "card", id: "f-consent" }, [el("label", { class: "agree" }, [agree, el("span", {}, [T.web_signup_consent || ""])])]));
    }
    sync();
  }
  $("form").addEventListener("input", function () { sync(); });
  $("form").addEventListener("change", function () { sync(); });
  // Show the contact's phone only with a contact name, and the baptism
  // address only when it isn't the church's.
  function sync() {
    var f = $("form");
    $("f-contact_phone").hidden = !f.contact_name.value.trim();
    var away = (f.querySelector("[name=baptism_same]:checked") || {}).value === "false";
    // A number pad for US ZIPs; letters too for postal codes elsewhere.
    var us = /^(|US|USA|U\.?S\.?A?\.?|UNITED STATES)$/i.test(f.country.value.trim());
    f.zip.inputMode = f.baptism_zip.inputMode = us ? "numeric" : "text";
    ["baptism_street", "baptism_city", "baptism_state", "baptism_zip"].forEach(function (n) { $("f-" + n).hidden = !away; });
  }
  // Shows the answers as saved (e.g. "Texas" comes back as TX).
  function fill(data) {
    var f = $("form");
    Object.keys(data).forEach(function (k) {
      var i = f.elements[k];
      if (!i) return;
      if (i.length && i[0] && i[0].type === "radio") Array.prototype.forEach.call(i, function (r) { r.checked = String(data[k]) === r.value; });
      else i.value = data[k] == null ? "" : data[k];
    });
    sync();
  }
  function status(text, kind) { var s = $("status"); s.textContent = text; s.className = kind || ""; }
  function fail(text) { $("form").hidden = true; $("bar").hidden = true; $("msg").hidden = false; $("msg").textContent = text; }

  // The form's current values, as sent to the API.
  function values() {
    var body = {};
    Array.prototype.forEach.call($("form").elements, function (i) {
      if (!i.name || (i.type === "radio" && !i.checked)) return;
      body[i.name] = i.type === "radio" ? i.value === "true" : i.type === "checkbox" ? i.checked : i.value;
    });
    return body;
  }

  // ---------- signing up (no key) ----------
  function loadSignup(lang, keep) {
    return fetch("/api/profile?part=signup&lang=" + encodeURIComponent(lang)).then(function (r) { return r.json(); }).then(function (d) {
      T = d.text || {};
      document.documentElement.lang = d.lang;
      document.documentElement.dir = d.dir;
      document.title = T.web_title || "Baptize 2027";
      $("intro").textContent = T.web_signup_intro || "";
      $("save").textContent = T.web_signup_button || "Sign up";
      $("langlabel").textContent = T.web_language || "Language";
      $("lang").replaceChildren.apply($("lang"), d.languages.map(function (l) {
        var o = el("option", { value: l.code }, [l.name]);
        o.selected = l.code === d.lang;
        return o;
      }));
      // The phone is theirs to type here; the rest is the church page's form.
      GROUPS[1][1][2] = ["phone", "web_phone", "tel", "tel", "web_phone_signup_hint"];
      render(Object.assign({ country: "US" }, keep || {}));
      $("msg").hidden = true; $("langcard").hidden = false; $("form").hidden = false; $("bar").hidden = false;
    }).catch(function () { fail("Couldn't connect. Check your signal and reload."); });
  }
  if (signingUp) {
    // The language picked on the front page (?lang=), else their browser's
    // when it's one we have, else English.
    var wanted = [new URLSearchParams(location.search).get("lang") || ""].concat((navigator.languages || [navigator.language || "en"]).map(function (l) { return String(l).slice(0, 2).toLowerCase(); }));
    fetch("/api/profile?part=signup&lang=en").then(function (r) { return r.json(); }).then(function (d) {
      var codes = (d.languages || []).map(function (l) { return l.code; });
      loadSignup(wanted.filter(function (c) { return codes.indexOf(c) >= 0; })[0] || "en");
    }).catch(function () { fail("Couldn't connect. Check your signal and reload."); });
    $("lang").addEventListener("change", function () { loadSignup($("lang").value, values()); });
  }

  if (!signingUp) fetch(api).then(function (r) { return r.json().then(function (d) { return [r.status, d]; }); }).then(function (x) {
    T = x[1].text || {};
    if (x[0] !== 200) return fail(T.web_bad_link || "This link doesn't work anymore.");
    document.documentElement.lang = x[1].lang;
    document.documentElement.dir = x[1].dir;
    // The logo is the heading; web_title names the browser tab.
    document.title = T.web_title || "Baptize 2027";
    $("intro").textContent = T.web_intro || "";
    $("save").textContent = T.web_save || "Save";
    // No country: a US signup from before the country question.
    render(Object.assign({}, x[1].church, { phone: x[1].phone, country: x[1].church.country || "US" }));
    $("msg").hidden = true; $("tabs").hidden = false;
    $("tab-signup").textContent = T.web_tab_signup || "Your signup";
    $("tab-photos").textContent = T.web_tab_photos || "Photos";
    $("pintro").textContent = T.web_photos_intro || "";
    $("ptemp").textContent = T.web_photos_temporary || "";
    // Baptisms: their running total.
    $("tab-baptisms").textContent = T.web_tab_baptisms || "Baptisms";
    $("bquestion").textContent = T.web_baptisms_question || "How many people have been baptized?";
    $("bhint").textContent = T.web_baptisms_hint || "";
    $("bsave").textContent = T.web_save || "Save";
    showCount(x[1].baptisms, x[1].baptisms_at);
    // Resources: shown only when there's a link to open.
    $("tab-resources").hidden = !/^https?:\/\//.test(T.resources_url || "");
    $("tab-resources").textContent = T.web_tab_resources || "Resources";
    $("rintro").textContent = T.web_resources_intro || "";
    $("ropen").textContent = T.web_resources_open || "Open the resources folder";
    $("ropen").href = T.resources_url || "#";
    $("add-text").textContent = T.web_add_photos || "Add photos";
    // #photos opens the tab; #photo-<id> (from a texted photo's receipt) also
    // shows that photo.
    // Just signed up on the web: say so once.
    if (/[?&]welcome=1/.test(location.search)) {
      $("welcome").textContent = T.web_signed_up || "You're signed up!";
      $("welcome").hidden = false;
      history.replaceState(null, "", location.pathname + location.hash);
    }
    loadHistory();
    show(/^#photos?(-\d+)?$/.test(location.hash) ? "photos" : location.hash === "#baptisms" ? "baptisms"
      : location.hash === "#resources" && !$("tab-resources").hidden ? "resources" : "signup", true);
  }).catch(function () { fail("Couldn't connect. Check your signal and reload."); });

  // ---------- tabs: the answers, or photos ----------
  var photosLoaded = false;
  function show(which, keepHash) {
    $("form").hidden = $("bar").hidden = $("history").hidden = which !== "signup";
    $("photos").hidden = which !== "photos";
    $("resources").hidden = which !== "resources";
    $("baptisms").hidden = which !== "baptisms";
    ["signup", "photos", "baptisms", "resources"].forEach(function (t) { $("tab-" + t).setAttribute("aria-pressed", String(t === which)); });
    if (!keepHash) history.replaceState(null, "", location.pathname + location.search + (which === "signup" ? "" : "#" + which));
    if (which === "photos" && !photosLoaded) loadPhotos();
  }
  ["signup", "photos", "baptisms", "resources"].forEach(function (t) { $("tab-" + t).addEventListener("click", function () { show(t); }); });
  // A photo link in the messages (#photo-<id>) opens it on the Photos tab.
  window.addEventListener("hashchange", function () {
    if (/^#photo-\d+$/.test(location.hash)) { show("photos", true); loadPhotos(); scrollTo(0, 0); }
  });

  // ---------- the conversation, under the signup form ----------
  function loadHistory() {
    fetch(api + "&part=messages").then(function (r) { return r.json(); }).then(function (d) {
      var list = d.messages || [], lang = document.documentElement.lang || undefined;
      $("htitle").textContent = T.web_messages_title || "Your messages";
      if (!list.length) return $("thread").replaceChildren(el("p", { class: "note" }, [T.web_no_messages || "No messages yet."]));
      $("thread").replaceChildren.apply($("thread"), list.reduce(function (out, m) {
        var cls = m.mine ? " mine" : "";
        var links = m.photos.map(function (id, i) {
          return el("a", { href: "#photo-" + id }, [(T.web_photo_link || "Photo") + (m.photos.length > 1 ? " " + (i + 1) : "")]);
        });
        if (m.body || links.length) out.push(el("div", { class: "bub" + cls }, links.concat(m.body ? [m.body] : [])));
        var when = new Date(m.at).toLocaleString(lang, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
        out.push(el("span", { class: "meta" + cls }, [(m.mine ? T.web_from_you || "You" : T.web_from_us || "Baptize 2027") + " · " + when]));
        return out;
      }, []));
    }).catch(function () { /* the history is extra; the page works without it */ });
  }

  // ---------- baptisms ----------
  function showCount(n, at) {
    $("bcount").value = n == null ? "" : n;
    $("bupdated").textContent = at ? (T.web_baptisms_updated || "Last updated") + ": " + new Date(at).toLocaleDateString(document.documentElement.lang || undefined) : "";
  }
  function bstatus(text, kind) { var s = $("bstatus"); s.textContent = text; s.className = kind || ""; }
  $("bform").addEventListener("submit", function (e) {
    e.preventDefault();
    var raw = $("bcount").value.trim();
    if (!/^\d+$/.test(raw)) return bstatus(T.web_baptisms_invalid || "Enter a whole number.", "bad");
    $("bsave").disabled = true; bstatus("…");
    fetch(api, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ baptisms: Number(raw) }) })
      .then(function (r) { return r.json().then(function (d) { return [r.status, d]; }); })
      .then(function (x) {
        if (x[0] !== 200) return bstatus(x[1].message || x[1].error || "!", "bad");
        showCount(x[1].baptisms, x[1].baptisms_at);
        bstatus(T.web_saved || "Saved.", "ok");
      })
      .catch(function () { bstatus("Couldn't connect. Try again.", "bad"); })
      .then(function () { $("bsave").disabled = false; });
  });

  function pstatus(text, kind) { var s = $("pstatus"); s.textContent = text; s.className = kind || ""; }
  function loadPhotos() {
    return fetch(photosApi).then(function (r) { return r.json(); }).then(function (d) {
      photosLoaded = true;
      var grid = $("grid");
      grid.replaceChildren();
      showChoice(d.allowed);
      if (!(d.photos || []).length) return grid.append(el("p", { class: "msg" }, [T.web_no_photos || "No photos yet."]));
      d.photos.forEach(function (p) {
        var del = el("button", { type: "button", class: "del" }, [T.web_delete || "Delete"]);
        del.addEventListener("click", function () {
          if (!confirm(T.web_delete_confirm || "Delete this photo for good?")) return;
          del.disabled = true;
          fetch(photosApi + "&id=" + p.id, { method: "DELETE" }).then(loadPhotos, function () { del.disabled = false; });
        });
        var label = p.waiting ? T.web_waiting_label || "Waiting for permission" : p.declined ? T.web_not_shared_label || "Not shared" : null;
        grid.append(el("figure", {}, [el("a", { href: p.url, target: "_blank", rel: "noopener" }, [el("img", { src: p.thumb, alt: "", loading: "lazy" })]),
          label ? el("span", { class: "wait" }, [label]) : null, del]));
      });
      // The photo a receipt linked to, large, with the limited-time note.
      var want = (location.hash.match(/^#photo-(\d+)$/) || [])[1];
      var shown = d.photos.filter(function (p) { return String(p.id) === want; })[0];
      $("viewer").hidden = !shown;
      if (shown) {
        $("viewer").replaceChildren(el("a", { href: shown.url, target: "_blank", rel: "noopener" }, [el("img", { src: shown.url, alt: "" })]),
          el("p", { class: "note" }, [T.web_photos_temporary || ""]));
      }
    }).catch(function () { pstatus("Couldn't connect. Check your signal and try again.", "bad"); });
  }

  // A photo made smaller in the browser (longest side at most `max`) and
  // re-encoded as JPEG, which also drops its location data:
  // { data (base64), w, h }.
  function shrink(file, max, quality) {
    return new Promise(function (done, fail) {
      var img = new Image(), src = URL.createObjectURL(file);
      img.onload = function () {
        var scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        var c = document.createElement("canvas");
        c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(src);
        done({ data: c.toDataURL("image/jpeg", quality).split(",")[1], w: c.width, h: c.height });
      };
      img.onerror = function () { URL.revokeObjectURL(src); fail(new Error("not an image")); };
      img.src = src;
    });
  }
  function upload(file) {
    return Promise.all([shrink(file, 2048, 0.85), shrink(file, 480, 0.8)]).then(function (x) {
      return fetch(photosApi, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image: x[0].data, thumb: x[1].data, width: x[0].w, height: x[0].h })
      }).then(function (r) { if (!r.ok) throw new Error(r.status); });
    });
  }
  // The church's one sharing choice: Opt in (with the permission statement)
  // until they allow it, then Opt out.
  var allowed = null;
  function showChoice(value) {
    allowed = value === true;
    $("choice").hidden = false;
    $("choice-text").textContent = allowed ? T.web_opted_in || "You've allowed Baptize 2027 to share your photos." : T.web_consent || "";
    $("choice-btn").textContent = allowed ? T.web_opt_out || "Opt out" : T.web_opt_in || "Opt in";
    $("choice-btn").className = allowed ? "out" : "";
  }
  $("choice-btn").addEventListener("click", function () {
    var allow = !allowed;
    if (!allow && !confirm(T.web_opt_out_confirm || "Stop sharing your photos?")) return;
    $("choice-btn").disabled = true;
    fetch(photosApi, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ allow: allow }) })
      .then(function (r) { if (!r.ok) throw new Error(r.status); pstatus(T.web_saved || "Saved.", "ok"); return loadPhotos(); })
      .catch(function () { pstatus("Couldn't connect. Try again.", "bad"); })
      .then(function () { $("choice-btn").disabled = false; });
  });

  $("file").addEventListener("change", function (e) {
    var input = e.currentTarget, files = Array.prototype.slice.call(input.files || []);
    if (!files.length) return;
    var failed = 0, i = 0;
    // One at a time, so a weak signal only has one photo in flight.
    (function next() {
      if (i === files.length) {
        input.value = "";
        pstatus(failed ? (T.web_upload_failed || "A photo couldn't be uploaded. Please try again.") : (T.web_uploaded || "Uploaded."), failed ? "bad" : "ok");
        return loadPhotos();
      }
      pstatus((T.web_uploading || "Uploading…") + (files.length > 1 ? " " + (i + 1) + "/" + files.length : ""));
      upload(files[i++]).catch(function () { failed++; }).then(next);
    })();
  });

  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var f = e.currentTarget, body = values();
    f.querySelectorAll(".err").forEach(function (n) { n.remove(); });
    f.querySelectorAll(".bad").forEach(function (n) { n.classList.remove("bad"); });
    $("save").disabled = true; status("…");
    if (signingUp) body.lang = $("lang").value;
    fetch(signingUp ? "/api/profile" : api, { method: signingUp ? "POST" : "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (d) { return [r.status, d]; }); })
      .then(function (x) {
        // Signed up: their own page, from now on their link.
        if (signingUp && x[0] === 200) { location.href = "/p/" + x[1].key + "?welcome=1"; return; }
        if (x[0] === 200) { fill(x[1].church); return status(T.web_saved || "Saved.", "ok"); }
        if (x[0] === 404) return fail(T.web_bad_link || "This link doesn't work anymore.");
        var box = x[1].field && $("f-" + x[1].field);
        status("", "");
        if (box) {
          box.classList.add("bad");
          box.append(el("span", { class: "err" }, [x[1].message || x[1].error]));
          box.scrollIntoView({ block: "center" });
          var i = box.querySelector("input"); if (i) i.focus();
        } else status(x[1].message || x[1].error || "!", "bad");
      })
      .catch(function () { status("Couldn't connect. Try again.", "bad"); })
      .then(function () { $("save").disabled = false; });
  });
})();
</script>
</body>
</html>
