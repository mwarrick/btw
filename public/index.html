<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baptize 2027 &middot; SMS Signup Demo</title>
<meta name="description" content="A preview of the Baptize 2027 church signup conversation, entirely over text message.">
<style>
  /* Layout: a single phone-sized chat column, sticky header + composer, scrolling thread between. */
  :root {
    --bg: #e9eef3;
    --phone: #f6f7f9;
    --header: #0b6ea8;
    --header-fg: #ffffff;
    --thread: #f6f7f9;
    --in-bubble: #e7ebf0;
    --in-fg: #0d1b26;
    --out-bubble: #0a84ff;
    --out-fg: #ffffff;
    --muted: #6b7a88;
    --line: #d4dbe2;
    --accent: #0b6ea8;
    --field: #ffffff;
    --field-fg: #0d1b26;
    --ribbon: #fff4d6;
    --ribbon-fg: #6b531a;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a0f14; --phone: #10161c; --header: #0b4a6e; --header-fg: #eaf4fb;
      --thread: #10161c; --in-bubble: #1d262f; --in-fg: #e7edf3; --out-bubble: #0a74e0;
      --out-fg: #ffffff; --muted: #8798a6; --line: #222c35; --accent: #4bb3e6;
      --field: #0b1218; --field-fg: #e7edf3; --ribbon: #2a2410; --ribbon-fg: #e3c878;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0a0f14; --phone: #10161c; --header: #0b4a6e; --header-fg: #eaf4fb;
    --thread: #10161c; --in-bubble: #1d262f; --in-fg: #e7edf3; --out-bubble: #0a74e0;
    --out-fg: #ffffff; --muted: #8798a6; --line: #222c35; --accent: #4bb3e6;
    --field: #0b1218; --field-fg: #e7edf3; --ribbon: #2a2410; --ribbon-fg: #e3c878;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; padding: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  body {
    background: var(--bg); color: var(--in-fg); font-family: var(--font);
    display: flex; flex-direction: column; align-items: center;
  }

  .wrap {
    width: 100%; max-width: 430px; height: 100%;
    display: flex; flex-direction: column; background: var(--phone);
    border-left: 1px solid var(--line); border-right: 1px solid var(--line);
  }

  header.bar {
    position: sticky; top: env(safe-area-inset-top, 0px);
    background: var(--header); color: var(--header-fg);
    padding-block: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; align-items: center; gap: 10px; z-index: 10;
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px); background: var(--header); z-index: 10;
  }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(255,255,255,0.18); display: grid; place-items: center;
    font-weight: 700; font-size: 15px; flex: 0 0 auto;
  }
  .bar .who { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
  .bar .who b { font-size: 15px; font-weight: 600; }
  .bar .who span { font-size: 11px; opacity: 0.85; }
  .bar .reset {
    margin-left: auto; background: rgba(255,255,255,0.16); color: var(--header-fg);
    border: none; border-radius: 7px; padding: 6px 10px; font-size: 12px;
    font-weight: 600; cursor: pointer;
  }
  .bar .reset:hover { background: rgba(255,255,255,0.28); }

  .ribbon {
    background: var(--ribbon); color: var(--ribbon-fg);
    font-size: 11.5px; text-align: center; line-height: 1.3;
    padding: 6px max(16px, env(safe-area-inset-left, 0px));
    border-bottom: 1px solid var(--line);
  }

  .thread {
    flex: 1 1 auto; overflow-y: auto; padding: 14px 12px 6px;
    display: flex; flex-direction: column; gap: 3px; background: var(--thread);
  }
  .row { display: flex; margin-top: 7px; }
  .row.in { justify-content: flex-start; }
  .row.out { justify-content: flex-end; }
  .bubble {
    max-width: 78%; padding: 8px 12px; border-radius: 18px;
    font-size: 15px; line-height: 1.35; white-space: pre-wrap;
    word-wrap: break-word; min-width: 0;
  }
  .in .bubble { background: var(--in-bubble); color: var(--in-fg); border-bottom-left-radius: 5px; }
  .out .bubble { background: var(--out-bubble); color: var(--out-fg); border-bottom-right-radius: 5px; }
  .meta { font-size: 10.5px; color: var(--muted); margin: 1px 4px 0; display: flex; }
  .meta.in { justify-content: flex-start; }
  .meta.out { justify-content: flex-end; }
  .note {
    align-self: center; text-align: center; font-size: 11.5px; color: var(--muted);
    margin: 10px 12px 2px; max-width: 32ch;
  }

  .typing .bubble { padding: 11px 14px; }
  .dots { display: inline-flex; gap: 4px; }
  .dots i {
    width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
    display: inline-block; animation: blink 1.3s infinite both;
  }
  .dots i:nth-child(2){ animation-delay: .2s; }
  .dots i:nth-child(3){ animation-delay: .4s; }
  @keyframes blink { 0%,80%,100%{ opacity:.3 } 40%{ opacity:1 } }
  @media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity:.6 } }

  .composer {
    position: sticky; bottom: 0; background: var(--phone);
    border-top: 1px solid var(--line); padding-block: 9px;
    padding-left: max(12px, env(safe-area-inset-left, 0px));
    padding-right: max(12px, env(safe-area-inset-right, 0px));
    padding-bottom: max(9px, env(safe-area-inset-bottom, 0px));
    display: flex; gap: 8px; align-items: flex-end;
  }
  .composer textarea {
    flex: 1 1 auto; resize: none; border: 1px solid var(--line);
    border-radius: 18px; padding: 9px 13px; font: inherit; font-size: 15px;
    background: var(--field); color: var(--field-fg);
    max-height: 110px; min-height: 20px; line-height: 1.3;
  }
  .composer textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .composer button {
    flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%;
    border: none; background: var(--out-bubble); color: #fff; font-size: 18px;
    cursor: pointer; display: grid; place-items: center;
  }
  .composer button:disabled { opacity: 0.4; cursor: not-allowed; }

  .hintbar { text-align: center; font-size: 11px; color: var(--muted); padding: 4px 10px 0; }
  .hintbar code { background: var(--in-bubble); padding: 1px 5px; border-radius: 4px; font-size: 11px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="avatar">B</div>
    <div class="who">
      <b>Baptize 2027</b>
      <span>Church signup by text</span>
    </div>
    <button class="reset" id="reset" type="button">Restart</button>
  </header>

  <div class="ribbon">Demo &mdash; a preview of the text-message signup, using the live prompts. Nothing is saved or sent.</div>

  <div class="thread" id="thread" aria-live="polite"></div>

  <div class="hintbar">
    Try <code>HELP</code>, <code>EDIT&nbsp;6</code>, <code>RESTART</code> or <code>STOP</code> anytime
  </div>

  <div class="composer">
    <textarea id="input" rows="1" placeholder="Text message" autocomplete="off" disabled></textarea>
    <button id="send" type="button" aria-label="Send" disabled>&#8593;</button>
  </div>
</div>

<script type="module">
// The conversation itself lives in /js/engine.js, the same code the SMS
// handler runs. This page only draws the bubbles.
import { createEngine } from "/js/engine.js";
import { smsInfo } from "/js/sms.js";

const thread = document.getElementById("thread");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const resetBtn = document.getElementById("reset");

let engine = null;
let state = null;
let outbox = [];
let sending = false;

function scroll() { thread.scrollTop = thread.scrollHeight; }

function segLabel(text) {
  const info = smsInfo(text);
  return `${info.segments} SMS · ${info.encoding}`;
}

function addBubble(side, text) {
  const row = document.createElement("div");
  row.className = "row " + side;
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;
  row.appendChild(b);
  thread.appendChild(row);
  const meta = document.createElement("div");
  meta.className = "meta " + side;
  meta.textContent = segLabel(text);
  thread.appendChild(meta);
  scroll();
}

function addNote(text) {
  const p = document.createElement("p");
  p.className = "note";
  p.textContent = text;
  thread.appendChild(p);
  scroll();
}

function setEnabled(on) {
  input.disabled = !on;
  sendBtn.disabled = !on;
  if (on) input.focus();
}

function queueReplies(replies) {
  outbox.push(...replies);
  pump();
}

// Shows each reply after a short "typing" pause, like a real thread.
function pump() {
  if (sending) return;
  if (!outbox.length) { setEnabled(!!engine); return; }
  sending = true;
  setEnabled(false);
  const text = outbox.shift();
  const row = document.createElement("div");
  row.className = "row in typing";
  row.innerHTML = '<div class="bubble"><span class="dots"><i></i><i></i><i></i></span></div>';
  thread.appendChild(row);
  scroll();
  setTimeout(() => {
    row.remove();
    addBubble("in", text);
    sending = false;
    pump();
  }, Math.min(900, 320 + text.length * 7));
}

function restart() {
  outbox = [];
  thread.replaceChildren();
  const first = engine.start();
  state = first.state;
  queueReplies(first.replies);
}

function onSend() {
  const text = input.value.replace(/\s+$/, "");
  if (!text.trim() || !engine) return;
  addBubble("out", text);
  input.value = "";
  input.style.height = "auto";
  const result = engine.reply(state, text);
  state = result.state;
  if (result.replies.length) queueReplies(result.replies);
  else if (state.phase === "stopped") addNote("No reply: after STOP, nothing is sent until the church texts START.");
}

sendBtn.addEventListener("click", onSend);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); onSend(); }
});
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(110, input.scrollHeight) + "px";
});
resetBtn.addEventListener("click", () => { if (engine) restart(); });

try {
  // Skip the browser cache so an edit at /admin shows on the next reload.
  const res = await fetch("/api/prompts", { cache: "no-store" });
  if (!res.ok) throw new Error(`status ${res.status}`);
  engine = createEngine(await res.json());
  restart();
} catch (err) {
  addNote("Couldn't load the messages. Reload the page to try again.");
}
</script>
</body>
</html>
